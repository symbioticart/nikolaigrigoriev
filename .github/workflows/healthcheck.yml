name: healthcheck

# A second pair of eyes on the data, from outside the machine that holds it.
#
# The site judges itself now — it reads its own /health, it can see whether the
# paintings it serves still match the record, and it gathers everything into one
# evening message. This job exists because a server is a poor witness to its own
# death: if it is wedged, confused, or serving a stored record while insisting it
# is live, it will say so to nobody. So something outside asks it, once, in the
# evening, before the digest goes out — and reports what it found through the
# same door as every other watcher.
#
# It no longer runs on push: deploy.sh now names the commit it wants and refuses
# to call a deploy finished until the site answers with that commit, which is the
# check this used to perform an hour later and less reliably.

on:
  schedule:
    - cron: '0 18 * * *'   # 20:00 Barcelona in summer, 19:00 in winter — before the 21:00 digest
  workflow_dispatch: {}

env:
  SITE: https://nikolaigrigoriev.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /health and judge
        run: |
          : > fails.txt
          if ! H=$(curl -fsS --max-time 90 --retry 3 --retry-delay 10 "$SITE/health"); then
            echo "Сайт не отвечает на /health.|Ни картина, ни страницы сейчас не открываются.|Смотреть логи: dashboard.render.com/web/srv-d7ektha8qa3s73ddeqd0" >> fails.txt
          else
            echo "$H"
            H="$H" node -e '
              let h;
              try { h = JSON.parse(process.env.H); }
              catch (e) {
                require("fs").appendFileSync("fails.txt", "Сайт отвечает мусором вместо состояния.|Сервер нездоров: /health вернул не JSON.|Смотреть логи: dashboard.render.com/web/srv-d7ektha8qa3s73ddeqd0\n");
                process.exit(0);
              }
              const out = [];
              const booting = (h.uptimeSec ?? 1e9) < 300;   // fresh deploy: sync has not had a chance yet
              const ru = (n,w1,w2,w5)=> n%100>10&&n%100<20 ? w5 : (n%10===1?w1 : (n%10>=2&&n%10<=4?w2:w5));
              const days = (n) => `${n} ${ru(n,"день","дня","дней")}`;
              if (h.tokenError) out.push([
                "Oura больше не пускает нас к данным.",
                "Новые дни не приходят, картина замерла на последнем записанном.",
                "Обновить OURA_TOKEN: dashboard.render.com/web/srv-d7ektha8qa3s73ddeqd0 → Environment.",
              ].join("|"));
              if (!h.live && !booting) out.push([
                "Сайт показывает сохранённую запись вместо живой.",
                "Живой синк с Oura не поднялся — картина есть, но она не дышит.",
                "Перезапустить сервис на Render.",
              ].join("|"));
              // The site now knows how far the paintings it serves have fallen
              // behind the record. A day is the rhythm; two is a stall — and for a
              // whole day in August this was the one broken thing on the site while
              // every check here reported green, because none of them looked.
              if ((h.stateBehindDays ?? 0) > 1) out.push([
                `Зритель видит картины от ${h.statePaintedDay}, а запись дошла до ${h.lastDataDay}.`,
                "Статичные состояния на сайте отстали от тела.",
                "Перезапустить daily-state.",
              ].join("|"));
              if ((h.dayCount ?? 0) < (h.lastKnownGoodDayCount ?? 0)) out.push([
                `Запись уменьшилась: ${h.dayCount} вместо ${h.lastKnownGoodDayCount}.`,
                "Это не бывает нормальным — дни из записи не исчезают.",
                "Смотреть логи сервера немедленно.",
              ].join("|"));
              // Silence is the work living its life, not a fault — the site paints
              // it and says so itself. Only a silence long enough to matter is
              // worth a second voice.
              const gap = h.gapDays ?? 0;
              if (gap > 14) out.push([
                `Кольцо молчит ${days(gap)}.`,
                "Картина иссыхает и идёт к исчезновению.",
                "Открыть Oura на телефоне и дать кольцу синхронизироваться — картина вернётся в цвет.",
              ].join("|"));
              const bad = Object.entries(h.perCollection||{}).filter(([,v])=>!v.ok).map(([k])=>k);
              if (bad.length) out.push([
                `Oura отдал не все данные: ${bad.join(", ")}.`,
                "Картина рисуется, часть метрик за эти дни могла не записаться.",
                "Ничего, обычно проходит к следующему синку.",
              ].join("|"));
              require("fs").appendFileSync("fails.txt", out.map(l=>l+"\n").join(""));
              if (out.length) console.error("HEALTH FAIL:\n" + out.join("\n"));
              else console.log(`HEALTH OK — день ${h.lastDataDay}, ${h.dayCount} дней, gap ${h.gapDays}, версия ${h.buildSha}`);
            '
          fi

      # Reported to the site, which decides whether this is worth interrupting a
      # day for or belongs in the evening. Dedup and repeat live there now.
      - name: Say what was found
        if: always()
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          [ -z "$OPS_SECRET" ] && { echo "no ops secret"; exit 0; }
          if [ -s fails.txt ]; then
            body=$(node -e '
              const lines = require("fs").readFileSync("fails.txt","utf8").trim().split("\n");
              const [what, why, act] = lines[0].split("|");
              const more = lines.length > 1 ? `\nИ ещё: ${lines.slice(1).map(l=>l.split("|")[0]).join(" ")}` : "";
              console.log(JSON.stringify({
                source: "проверка данных",
                level: "broken",
                headline: what,
                detail: (why || "") + more,
                action: act || "",
                runUrl: "github.com/" + process.env.R + "/actions/runs/" + process.env.I,
              }));
            ' R="$GITHUB_REPOSITORY" I="$GITHUB_RUN_ID")
          else
            body='{"source":"проверка данных","level":"ok","headline":"Данные снова в порядке."}'
          fi
          curl -fsS --max-time 15 -X POST "$SITE/ops/report" \
            -H "x-ops-secret: $OPS_SECRET" -H 'Content-Type: application/json' \
            -d "$body" > /dev/null || echo "could not reach the site to report"

      - name: Mark the run red if problems were found
        run: '[ -s fails.txt ] && exit 1 || exit 0'
