name: daily-89

# Every morning the frame of Variation 89 as it stands that day is committed
# into 89/record/<date>.png — the write-once archive of what the painting looked
# like. Full resolution 1080×1920, exactly the page's own canvas pixels via
# canvas.toDataURL. It is kept EVERY day, silent days included: a short silence
# holds the last day, a long one desiccates the painting a little more each day
# toward disappearance, so every frame differs — the record of the sleep. A
# returning signal resurrects the work with a seam.
#
# This job no longer writes to Telegram. It used to send the morning frame, and
# so did the timer on ootrohome — one work, two posters, arriving hours apart in
# different words, because GitHub's scheduler runs this between 26 and 218
# minutes late. The poster is the home server's job now; the archive is this one's.

on:
  schedule:
    # After the 09:30 Barcelona sync in either half of the year — and it asks for
    # a sync of its own below, so the frame is of the day the body just wrote
    # rather than of the day before it.
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  SITE: https://nikolaigrigoriev.com

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask the ring first
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          curl -fsS -m 120 -X POST "$SITE/ops/sync" -H "x-ops-secret: $OPS_SECRET" || \
            echo "could not ask for a sync — recording whatever the site shows"

      - name: Render /89 and capture the canvas
        # everything happens in RUNNER_TEMP so the checked-out repo stays clean
        # for the record commit below
        run: |
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null && npm i --no-save puppeteer-core@23 > /dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          CHROME="$CHROME" node -e '
            const fs = require("fs");
            const puppeteer = require("puppeteer-core");
            (async () => {
              const browser = await puppeteer.launch({
                executablePath: process.env.CHROME,
                args: ["--no-sandbox", "--enable-unsafe-swiftshader", "--hide-scrollbars"],
              });
              const page = await browser.newPage();
              await page.setViewport({ width: 1200, height: 2000 });
              await page.goto(process.env.SITE + "/89", { waitUntil: "networkidle2", timeout: 60000 });
              await page.waitForFunction("window.__STORY_READY === true", { timeout: 90000 });
              await new Promise(r => setTimeout(r, 1500));
              const dataUrl = await page.evaluate(() =>
                document.getElementById("story").toDataURL("image/png"));
              fs.writeFileSync("89-frame.png", Buffer.from(dataUrl.split(",")[1], "base64"));
              await browser.close();
              console.log("captured", fs.statSync("89-frame.png").size, "bytes");
            })().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Commit the frame into the record (89/record/)
        run: |
          today=$(TZ=Europe/Madrid date +%Y-%m-%d)
          mkdir -p 89/record
          if [ -f "89/record/${today}.png" ]; then
            echo "frame for ${today} already recorded — write-once, keeping the original"
          else
            cp "$RUNNER_TEMP/89-frame.png" "89/record/${today}.png"
            git config user.name "variation-89 record"
            git config user.email "record@nikolaigrigoriev.com"
            git add "89/record/${today}.png"
            git commit -m "record: variation 89 frame ${today} [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      # Painting the states ahead used to be the fourth step of this job, which
      # meant a failure while photographing /89 also stopped the site's paintings
      # from being repainted — and the only alert spoke about the frame. It has
      # its own job now: daily-state.yml, with its own alert.

      - name: Say what happened
        if: always()
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          [ -z "$OPS_SECRET" ] && exit 0
          if [ "${{ job.status }}" = "success" ]; then
            body='{"source":"архив 89","level":"ok","headline":"Сегодняшний кадр записан в архив."}'
          else
            body=$(R="$GITHUB_REPOSITORY" I="$GITHUB_RUN_ID" node -e 'console.log(JSON.stringify({
              source: "архив 89",
              level: "watch",
              headline: "Не получилось записать сегодняшний кадр в архив проекта 89.",
              detail: "На сайт и на картину это не влияет — работа живёт дальше. Пропущен один день в write-once архиве кадров.",
              action: "Перезапустить daily-89: github.com/" + process.env.R + "/actions/workflows/daily-89.yml",
              runUrl: "github.com/" + process.env.R + "/actions/runs/" + process.env.I,
            }))')
          fi
          curl -fsS --max-time 15 -X POST "$SITE/ops/report" \
            -H "x-ops-secret: $OPS_SECRET" -H 'Content-Type: application/json' \
            -d "$body" > /dev/null || echo "could not reach the site to report"
