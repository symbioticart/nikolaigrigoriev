name: ci

# Nothing reaches the work without first passing through here.
#
#   push to staging → laws → deploy the rehearsal → walk it as a reader
#   push to main    → laws → deploy the site → walk it → roll back if it is wrong
#
# The laws are what the certificate promises: a finished day is never repainted,
# a day is weighed only against the days before it, silence begins on the second
# day and never touches the form, no measurement can be read back out, the
# record stays sealed. A red run here means the work has changed, not the code.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Twice a day, and deliberately after the morning has finished painting and
    # deploying. The 09:00 run used to land in the middle of daily-state and
    # judge a site that was mid-change; both of 15 August's red messages came
    # from that window.
    - cron: '0 11,19 * * *'   # walk the living site twice a day

permissions:
  contents: read

env:
  PROD: https://nikolaigrigoriev.com
  REHEARSAL: https://nikolaigrigoriev-staging.onrender.com
  PROD_SERVICE: srv-d7ektha8qa3s73ddeqd0
  REHEARSAL_SERVICE: srv-d9s459ifngtc73ehh750

jobs:
  laws:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # No install step: the site has no dependencies, and that is a condition
      # of the work rather than an oversight.
      - run: npm test

  # ── The rehearsal ────────────────────────────────────────────────────────
  rehearsal:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Put it up
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: bash scripts/deploy.sh "$REHEARSAL_SERVICE"
      - name: Walk it as a reader
        env:
          SMOKE_AUTH: ${{ secrets.STAGING_AUTH }}
        run: |
          npm i --no-save puppeteer-core@23 > /dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium) \
            node scripts/smoke.js "$REHEARSAL" --rehearsal
      - name: Say it is ready to be looked at
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -z "$TG_BOT_TOKEN" ] && exit 0
          msg=$(git log -1 --pretty=%s)
          curl -fsS --max-time 15 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" -d disable_web_page_preview=true -d disable_notification=true \
            --data-urlencode "text=🧪 Репетиция обновлена и проверена: ${msg}. Посмотреть: ${REHEARSAL}" || true

  # ── The work itself ──────────────────────────────────────────────────────
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Remember what is standing now
        id: before
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          [ -z "$RENDER_API_KEY" ] && { echo "id=" >> "$GITHUB_OUTPUT"; exit 0; }
          id=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$PROD_SERVICE/deploys?limit=20" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const live=JSON.parse(s).map(x=>x.deploy).find(d=>d.status==="live");
                console.log(live?live.id:"")})')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "standing: ${id:-unknown}"

      - name: Put it up
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERIFY_URL: https://nikolaigrigoriev.com
        run: bash scripts/deploy.sh "$PROD_SERVICE" "$GITHUB_SHA"

      - name: Walk it as a reader
        id: smoke
        run: |
          npm i --no-save puppeteer-core@23 > /dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium) \
            node scripts/smoke.js "$PROD"

      # If the site is wrong after a deploy, put back what was standing before
      # it. A rollback reuses the old build, so it is quick.
      - name: Put back what was standing
        if: failure() && steps.before.outputs.id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$PROD_SERVICE/rollback" \
            -d '{"deployId":"${{ steps.before.outputs.id }}"}' | head -c 200
          echo "rolled back to ${{ steps.before.outputs.id }}"

      # Reported to the site, which is the only thing that speaks to Telegram.
      - name: Say what happened
        if: always()
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          [ -z "$OPS_SECRET" ] && exit 0
          msg=$(git log -1 --pretty=%s)
          if [ "${{ job.status }}" = "success" ]; then
            body=$(M="$msg" node -e 'console.log(JSON.stringify({
              source: "релиз", level: "ok",
              headline: "На сайте новая версия: " + process.env.M + ". Прошла проверку глазами зрителя.",
            }))')
          else
            body=$(M="$msg" R="$GITHUB_REPOSITORY" I="$GITHUB_RUN_ID" node -e 'console.log(JSON.stringify({
              source: "релиз", level: "broken",
              headline: "Обновление сайта не прошло проверку и откачено: " + process.env.M + ".",
              detail: "Сайт цел и показывает предыдущую версию — зритель ничего не потерял.",
              action: "Смотреть лог: github.com/" + process.env.R + "/actions/runs/" + process.env.I,
              runUrl: "github.com/" + process.env.R + "/actions/runs/" + process.env.I,
            }))')
          fi
          curl -fsS --max-time 15 -X POST "$PROD/ops/report" \
            -H "x-ops-secret: $OPS_SECRET" -H 'Content-Type: application/json' \
            -d "$body" > /dev/null || echo "could not reach the site to report"

  # ── Twice a day, walk the living site whether or not anything changed ────
  watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm i --no-save puppeteer-core@23 > /dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium) \
            node scripts/smoke.js "$PROD"
      # The old message said only that a check had failed, which told nobody
      # anything: on 15 August it was right twice and read as noise both times.
      # What it says now is what a visitor would actually have seen.
      - name: Say what a reader would have found
        if: always()
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          [ -z "$OPS_SECRET" ] && exit 0
          if [ "${{ job.status }}" = "success" ]; then
            body='{"source":"взгляд зрителя","level":"ok","headline":"Сайт снова показывает то, что должен."}'
          else
            body=$(W="$(cat wrong.txt 2>/dev/null)" R="$GITHUB_REPOSITORY" I="$GITHUB_RUN_ID" node -e 'console.log(JSON.stringify({
              source: "взгляд зрителя",
              level: "broken",
              headline: "Прошёл сайт как зритель — увидел не то, что должен.",
              detail: (process.env.W || "").trim().slice(0, 600) || "Подробности в логе прогона.",
              action: "Смотреть лог: github.com/" + process.env.R + "/actions/runs/" + process.env.I,
              runUrl: "github.com/" + process.env.R + "/actions/runs/" + process.env.I,
            }))')
          fi
          curl -fsS --max-time 15 -X POST "$PROD/ops/report" \
            -H "x-ops-secret: $OPS_SECRET" -H 'Content-Type: application/json' \
            -d "$body" > /dev/null || echo "could not reach the site to report"
