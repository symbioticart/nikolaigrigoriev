name: ci

# The laws of the work, checked before anything reaches it.
#
# These tests assert what the certificate promises: that a finished day is
# never repainted, that a day is weighed only against the days before it, that
# silence begins on the second day and never touches the form, that no
# measurement can be read back out, and that the record itself stays sealed.
# A red run here means the work has changed — not merely the code.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch: {}

jobs:
  laws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step: the site has no dependencies, and that is a condition
      # of the work rather than an oversight.
      - name: Assert the laws
        run: npm test

      - name: Say so if a law broke
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -z "$TG_BOT_TOKEN" ] && exit 0
          curl -fsS --max-time 15 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" -d disable_web_page_preview=true \
            --data-urlencode "text=🔴 Проверка законов работы не прошла на ветке ${GITHUB_REF_NAME}. Изменилось что-то, что меняться не должно: заморозка прошлого, кривая тишины, семя дня или герметичность записи. Смотреть: github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
