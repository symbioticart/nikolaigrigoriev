name: daily-state

# Paint the day the body has just written, and put it where the site can find
# it before any engine loads.
#
# This used to be the fourth step of the morning-frame job, which meant a
# failure while photographing /89 stopped the states from ever being repainted
# — and the only alert said the frame had failed. The site then showed a
# fortnight-old painting labelled "Today" and nothing anywhere noticed. It is
# its own job now, with its own report, and it says which surface broke.

on:
  schedule:
    # Once a day, in the morning, by the artist's decision. A day the ring hands
    # over later waits for the next morning; until then the site shows the
    # morning's painting rather than making its own copy of that day on the
    # spot. What must not happen is the site quietly painting a second version.
    #
    # 08:15 UTC — GitHub's scheduler has run this between 26 and 92 minutes late
    # over the last fortnight, so the painting lands somewhere in the middle of
    # the morning either way. What matters is that it is after the 09:30
    # Barcelona sync, when the night the body just wrote is actually in the
    # record. Before that it painted yesterday, every single day.
    - cron: '15 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  SITE: https://nikolaigrigoriev.com
  SERVICE: srv-d7ektha8qa3s73ddeqd0

jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ask the ring before painting. The site syncs on its own clock, and a job
      # that arrives between two slots would otherwise paint a day old record —
      # which is exactly how the paintings ran a day behind every morning.
      - name: Ask the ring first
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          curl -fsS -m 120 -X POST "$SITE/ops/sync" -H "x-ops-secret: $OPS_SECRET" || \
            echo "could not ask for a sync — painting from whatever the site has"

      - name: Paint what has not been painted
        run: |
          npm init -y > /dev/null && npm i --no-save puppeteer-core@23 > /dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          CHROME="$CHROME" node scripts/gen-state.js "$SITE" state

      # What the record said at the moment of painting. The proof below is held
      # against THIS, not against the record as it stands afterwards: the server
      # restarts on the deploy and re-syncs, and comparing the painting to a
      # record that moved underneath it failed the job on 14 August for a
      # painting that was perfectly correct.
      - name: Remember what the body had written when we painted
        id: wrote
        run: |
          last=$(curl -fsS -m 60 "$SITE/state/meta.json" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const m=JSON.parse(s);
                const days=Object.values(m).map(w=>(w.alive||[]).slice(-1)[0]).filter(Boolean).sort();
                console.log(days[days.length-1]||"")})')
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "painted against $last"

      - name: File the paintings
        id: file
        run: |
          git config user.name  "state"
          git config user.email "state@nikolaigrigoriev.com"
          git add state
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "nothing new to paint"
          else
            git commit -q -m "state: paint the days just written [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # A commit is not a deployment. The auto-deploy webhook has been
      # unreliable, and a painting that never reaches the server is a painting
      # that does not exist — this is precisely how the site came to be stale.
      # deploy.sh names the commit and then checks which one actually answers.
      - name: Carry them to the site
        if: steps.file.outputs.changed == 'yes'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERIFY_URL: https://nikolaigrigoriev.com
        run: |
          [ -z "$RENDER_API_KEY" ] && { echo "no Render key — the site will pick these up on the next deploy"; exit 0; }
          bash scripts/deploy.sh "$SERVICE" "${{ steps.file.outputs.sha }}"

      # Prove it: the newest written day of every work must be on the site, and
      # the manifest must reach as far as the record did when we painted. This is
      # the check that was missing when Archipelago silently vanished from the
      # manifest.
      #
      # It asks more than once. Twice in a fortnight it fired because the service
      # was still coming up behind its disk and answered 502 — an alarm about
      # nothing, sent to a phone. smoke.js has had retries for exactly this since
      # the beginning; this one did not.
      - name: Prove the site can show what we painted
        run: |
          set -e
          fetch() {
            for i in $(seq 1 12); do
              out=$(curl -fsS --max-time 30 "$1" 2>/dev/null) && { printf '%s' "$out"; return 0; }
              sleep 10
            done
            return 1
          }
          health=$(fetch "$SITE/health") || { echo "the site never answered"; exit 1; }
          manifest=$(fetch "$SITE/state/index.json") || { echo "the manifest never answered"; exit 1; }
          echo "$health" | head -c 200; echo
          WROTE='${{ steps.wrote.outputs.last }}' MANIFEST="$manifest" node - <<'JS'
          const man = JSON.parse(process.env.MANIFEST);
          const wrote = process.env.WROTE;
          const problems = [];
          for (const [id, m] of Object.entries(man)) {
            if (!m || !m.last) { problems.push(`${id}: absent from the manifest entirely`); continue; }
            const behind = Math.round((Date.parse(wrote) - Date.parse(m.last)) / 86400000);
            // A day behind is the rhythm: the painter runs once a morning and the
            // record can move after it. Two days is a stall — the same tolerance
            // smoke.js applies, so the two watchers can no longer disagree.
            if (behind > 1) problems.push(`${id}: the site shows ${m.last}, the body had written to ${wrote}`);
          }
          if (problems.length) { console.error(problems.join('\n')); process.exit(1); }
          console.log('every work shows the last day its body wrote');
          JS

      - name: Fetch one of them, as a reader would
        run: |
          for id in $(curl -fsS "$SITE/state/index.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(Object.keys(JSON.parse(s)).join(" ")))'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/state/$id.webp")
            echo "$id → HTTP $code"
            [ "$code" = "200" ] || exit 1
          done

      # Report to the site, which is the only thing that speaks to Telegram.
      - name: Say what happened
        if: always()
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          [ -z "$OPS_SECRET" ] && exit 0
          if [ "${{ job.status }}" = "success" ]; then
            body='{"source":"картины","level":"ok","headline":"Сегодняшние картины на сайте."}'
          else
            body=$(R="$GITHUB_REPOSITORY" I="$GITHUB_RUN_ID" node -e 'console.log(JSON.stringify({
              source: "картины",
              level: "broken",
              headline: "Сегодняшние картины не дошли до сайта.",
              detail: "Зритель видит вчерашнее или позавчерашнее до того, как загрузится движок. Что-то из трёх: утреннее рисование не прошло, деплой увёз не тот коммит, или файлы не отдаются.",
              action: "Перезапустить daily-state: github.com/" + process.env.R + "/actions/workflows/daily-state.yml",
              runUrl: "github.com/" + process.env.R + "/actions/runs/" + process.env.I,
            }))')
          fi
          curl -fsS --max-time 15 -X POST "$SITE/ops/report" \
            -H "x-ops-secret: $OPS_SECRET" -H 'Content-Type: application/json' \
            -d "$body" > /dev/null || echo "could not reach the site to report"
