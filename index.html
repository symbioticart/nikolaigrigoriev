<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikolai Grigoriev</title>
<meta name="description" content="Nikolai Grigoriev — conceptual artist. Living works drawn day by day from one body's record.">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main id="main">
  <div class="wrap" id="selected"></div>
</main>
<script src="/assets/site.js"></script>
<script>
  Site.mountHeader(null);
  const host = document.getElementById('selected');
  const selected = Site.WORKS.filter((w) => w.selected);

  (async () => {
    for (let i = 0; i < selected.length; i++) {
      const w = selected[i];
      const section = document.createElement('section');
      section.className = 'work-stage home-stage';
      host.appendChild(section);
      // mount sequentially: the two works share the browser's WebGL budget,
      // and each work's iframe renders through a single context.
      await Site.mountArtBlock(section, {
        id: w.id, titleLink: true,
        maxW: 940, maxH: 620, maxHvh: 0.60, railGutter: 40,
      });
    }
  })();
</script>
</body>
</html>
