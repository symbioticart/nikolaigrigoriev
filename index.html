<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikolai Grigoriev</title>
<meta name="description" content="Nikolai Grigoriev — conceptual artist. Living works drawn day by day from one body's record.">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main id="main">
  <div class="wrap" id="selected"></div>
</main>
<script src="/assets/site.js"></script>
<script>
  Site.mountHeader(null);
  const host = document.getElementById('selected');
  const selected = Site.WORKS.filter((w) => w.selected);

  (() => {
    // Both works are mounted at once. Each shows its ready-made state image
    // straight away, so neither waits on the other's engine — and no painting
    // happens at all until a day is paged.
    const sections = selected.map((w) => {
      const section = document.createElement('section');
      section.className = 'work-stage home-stage';
      host.appendChild(section);
      return { w, section };
    });
    sections.forEach(({ w, section }) => {
      Site.mountArtBlock(section, {
        id: w.id, titleLink: true,
        maxW: 940, maxH: 620, maxHvh: 0.60, railGutter: 40,
      });
    });
  })();
</script>
</body>
</html>
