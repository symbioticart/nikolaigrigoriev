<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works — Nikolai Grigoriev</title>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main id="main">
  <div class="wrap">
    <div class="grid-head">
      <h1>Works</h1>
    </div>
    <div class="works-grid" id="grid"></div>
  </div>
</main>
<script src="/assets/site.js"></script>
<script>
  Site.mountHeader('works');
  const grid = document.getElementById('grid');

  async function mountTile(w) {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = `/work.html?id=${w.id}`;
    a.innerHTML =
      `<div class="tile-frame"><img alt="${w.title}"></div>` +
      `<div class="tile-cap"><span class="t">${w.title}</span> <span class="s"></span></div>`;
    grid.appendChild(a);

    // Shape + caption as soon as metadata is known — never blocked on a paint.
    const meta = await Site.ready(w.id);
    const frame = a.querySelector('.tile-frame');
    frame.style.setProperty('--r', meta.ratio);
    a.querySelector('.s').textContent = `${Site.fmtYear(meta.birth)} – Today`;

    // Fire the render without blocking; fill the tile when it arrives.
    const wpx = Math.round(frame.getBoundingClientRect().width) || 540;
    const hpx = Math.round(wpx / meta.ratio);
    // The work as it stands today — the end of its calendar, not the last day
    // the body wrote. A silence is part of the work, so the tile should show it
    // faded exactly as the home page does; and today is painted ahead, so the
    // tile arrives as a download instead of a repaint.
    const latest = meta.last;
    Site.render(w.id, latest, wpx, hpx).then((url) => {
      if (!url) return;
      const img = a.querySelector('img');
      img.onload = () => img.classList.add('in');
      img.src = url;
    });
  }

  // Build every tile up front; paints resolve independently. An unlisted work
  // is not among them: nothing on the site leads to it.
  Site.WORKS.filter((w) => !w.unlisted).forEach(mountTile);
</script>
</body>
</html>
