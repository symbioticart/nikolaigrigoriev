<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>render</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden}
  #off{position:fixed;left:-10000px;top:0}
</style>
</head>
<body>
<div id="off"></div>

<!-- shared engine (identical across works) -->
<script src="lib/p5.min.js"></script>
<script src="lib/p5.oil.js"></script>
<script src="lib/print-texture.js"></script>
<script src="silence.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────────────────
   Generic painter host. One iframe = one work = one JS realm, so the two
   painters' colliding globals never meet and the `oil` singleton binds to
   this iframe's single WEBGL context only.

   The painting is rendered at a FIXED high-resolution buffer and painted
   SYNCHRONOUSLY (p5 2.x redraw() is deferred and would capture the previous
   frame — the cause of washed-out / mismatched output). The full buffer is
   read back with gl.readPixels (alpha forced to 255 to avoid the
   premultiplied-alpha washout of translucent oil) and downscaled to the
   requested display size.

   Protocol (postMessage with parent):
     iframe → parent  {type:'ready', work, birth, last, ratio, alive:[…], incomplete:[…]}
     parent → iframe  {type:'render', reqId, date, w, h}
     iframe → parent  {type:'render', reqId, ok, date, url}
   ───────────────────────────────────────────────────────────────────────── */
(function () {
  const params = new URLSearchParams(location.search);
  const WORK = params.get('work') || '87';

  /* What follows is what each work DOES: where its days sit inside its record,
     and which painter is called. Who each work IS — the painter's path, its
     canvas, the shape of its record — is said once in /works.json and read
     from there at boot. The two used to be written out here together, so a
     canvas changed in the registry left this host still painting the old size. */
  const CONFIG = {
    '87': {
      // The same record that feeds nikolaigrigoriev.com, so the work keeps
      // living. Server returns { days:[{d,s,c,i}], meta:{birth,lastDataDay,…} }.
      birth: (D) => (D.meta && D.meta.birth) || (D.days[0] && D.days[0].d),
      last:  (D) => (D.meta && (D.meta.lastDataDay || D.meta.last)) || (D.days[D.days.length - 1] && D.days[D.days.length - 1].d),
      today: (D) => D.meta && D.meta.serverDate,
      live:  (D) => !D.meta || D.meta.live !== false,
      days: (D) => D.days,
      // Silence is NOT fed to the painter. The painter still accepts a `silence`
      // argument from the superseded model, where the unwritten ground grew and
      // every mark was re-placed inside a shrinking frame — which meant a body
      // that wrote nothing still produced a differently composed painting each
      // day. The approved model (art/silence.js, 2026-07-27) is the opposite: the
      // last painting is HELD, and only its colour drains and dissolves. No new
      // data, no new form.
      paint: (p, day, D, w, h, sil) => window.Painter.paintDay(p, day, D, w, h),
    },
    '89': {
      // /89/data.json returns { days:[raw Oura metrics], meta }.
      birth: (D) => D.days[0] && D.days[0].day,
      last:  (D) => D.days[D.days.length - 1] && D.days[D.days.length - 1].day,
      today: (D) => D.meta && D.meta.serverDate,
      live:  (D) => !D.meta || D.meta.live !== false,
      days: (D) => D.days,
      // OuraPainter has no silence arg — withering is applied as a filter below.
      paint: (p, day, D, w, h, sil) => window.OuraPainter.paintDay(p, day, D, w, h),
    },
    '91': {
      // /91/data.json returns { days:[…], meta } — the work's own record.
      // The sheet accumulates: the painter replays every day up to the one
      // asked for, so the picture of a day is the whole life up to it.
      birth: (D) => D.days[0] && D.days[0].day,
      last:  (D) => D.days[D.days.length - 1] && D.days[D.days.length - 1].day,
      today: (D) => D.meta && D.meta.serverDate,
      live:  (D) => !D.meta || D.meta.live !== false,
      days: (D) => D.days,
      // Silence never reaches this painter either: a silent day simply lays
      // nothing, and the fading is applied to the finished sheet below.
      paint: (p, day, D, w, h, sil) => window.V91Painter.paintDay(p, day, D, w, h),
    },
    'archipelago': {
      // LIVE: /archipelago/data.json returns { nights:[…the night itself…], meta }.
      // A third work on this domain, and the first that is painted from ONE
      // NIGHT rather than from the day it closed — so its record is the night
      // series, not the daily one, and its calendar holds only nights the ring
      // actually wrote a hypnogram for.
      // The sheet is composed in 2D — the level set is computed per pixel and
      // the print fill, the ground grain and the rim are composite operations.
      // Only the dry brush is WEBGL. So the host takes the finished canvas the
      // painter returns instead of reading the GL buffer back.
      birth: (D) => D.nights[0] && D.nights[0].day,
      last:  (D) => D.nights[D.nights.length - 1] && D.nights[D.nights.length - 1].day,
      today: (D) => D.meta && D.meta.serverDate,
      live:  (D) => !D.meta || D.meta.live !== false,
      days: (D) => D.nights,
      // This work DOES take the silence: its rim is the pulse, and a heart that
      // has stopped reporting must stop being visible before the mass does. The
      // rest of the withering is applied to the finished image below, as for
      // every other work, so the form itself never moves.
      usesSilence: true,
      paint: (p, day, D, w, h, sil) => window.ArchipelagoPainter.paintDay(p, day, D, w, h, sil),
    },
  };
  let cfg = null, RATIO = 0;
  async function identity() {
    const all = await fetch('/works.json', { cache: 'no-cache' }).then((r) => r.json());
    const w = all[WORK];
    if (!w) throw new Error(`no such work: ${WORK}`);
    cfg = Object.assign({
      painter: w.engine.painter,
      dataUrl: w.engine.data,
      dateField: w.engine.dateField,
      baseW: w.canvas.w, baseH: w.canvas.h, pd: w.canvas.density,
      readback: w.engine.readback,
    }, CONFIG[WORK]);
    RATIO = cfg.baseW / cfg.baseH;
  }

  let DATA = null, p5i = null, glCanvas = null, ready = false;
  let painted = null;      // target day currently held in the readback buffer
  // The calendar ends TODAY, not on the last day the body wrote — otherwise the
  // days of silence never exist and the work can never be seen dying.
  let calEnd = null;
  const queue = [];
  const byDate = new Map();
  const resolve = new Map();     // every calendar date → { target, gap }

  function daysBetween(a, b) {
    return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
  }
  function addDaysISO(iso, n) {
    return new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
  }
  // Silence / withering — data-room canon "Death without erasure" (C-12,
  // 2026-07-23): a short silence (≤14d) PAUSES — the last painting petrifies,
  // held. A longer silence DESICCATES — colour drains and presence fades until,
  // by day 90, the image DISAPPEARS into a blank canvas (death is blank, never
  // black). Any later signal resurrects it to full colour. Lineage: Opałka, Kawara.
  // Silence/death curve lives in one shared module (art/silence.js), used here
  // and by the archive — so every surface withers identically.
  const silenceFor = (gap) => window.SILENCE.params(gap);

  // scratch canvases: `full` = the opaque, Y-corrected full-res frame;
  // `out` = the downscaled deliverable.
  const full = document.createElement('canvas');
  const fctx = full.getContext('2d');
  const out = document.createElement('canvas');
  const octx = out.getContext('2d');

  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src));
      document.body.appendChild(s);
    });
  }

  async function boot() {
    await identity();
    await loadScript(cfg.painter);
    // 'no-cache' (not 'no-store'): still always revalidated against the server,
    // but an unchanged record comes back as a tiny 304 instead of re-downloading
    // the whole payload — the data is live yet costs almost nothing on repeat views.
    DATA = await fetch(cfg.dataUrl, { cache: 'no-cache' }).then((r) => r.json());
    cfg.days(DATA).forEach((d) => byDate.set(d[cfg.dateField], d));

    // Map every calendar date (birth → TODAY) to the painting it shows: an alive
    // date shows its own day (gap 0); a silent date holds the last painting
    // before it, withering by the gap length.
    //
    // The calendar runs to TODAY, not to the last day the body wrote. A silence
    // does not suspend the work — the work goes on living through it, drying and
    // fading. Ending the calendar at the last data day made those days not exist,
    // so the work could never be seen dying and a fortnight-old painting was
    // labelled "Today" at full colour.
    //
    // Exception (false-death guard, canon C-7): if the server never confirmed a
    // sync this boot (meta.live === false) it is serving a frozen record and
    // cannot tell a silent body from an unreachable vendor. Then the calendar
    // stops at the last written day — a vendor outage must never be painted as
    // the owner's silence. Self-heals on the next successful sync.
    const birth = cfg.birth(DATA), last = cfg.last(DATA);
    // The server decides where the calendar ends (meta.calendarEnd) — including
    // the false-death guard — so this and the page agree by construction.
    const served = DATA.meta && DATA.meta.calendarEnd;
    if (served && daysBetween(last, served) >= 0) {
      calEnd = served;
    } else {
      const today = cfg.today && cfg.today(DATA);
      const liveOk = !cfg.live || cfg.live(DATA);
      calEnd = (liveOk && today && daysBetween(last, today) > 0) ? today : last;
    }
    let lastAlive = birth;
    for (let d = birth; daysBetween(d, calEnd) >= 0; d = addDaysISO(d, 1)) {
      if (byDate.has(d)) { lastAlive = d; resolve.set(d, { target: d, gap: 0 }); }
      else resolve.set(d, { target: lastAlive, gap: daysBetween(lastAlive, d) });
    }

    new p5((p) => {
      p.setup = () => {
        // Fixed painting buffer — the painter composes its fill for this exact
        // size (as in production), so the work occupies the right ~75% of the
        // canvas. We downscale the readback to the requested delivery size.
        if (p.pixelDensity) p.pixelDensity(cfg.pd);
        const c = p.createCanvas(cfg.baseW, cfg.baseH, p.WEBGL2 || p.WEBGL);
        c.parent('off');
        glCanvas = c.elt;
        p5i = p;
        p.noLoop();
        ready = true;
        announce();
        // Warm-up frame: the oil engine's first paint after context creation
        // comes out cold/washed. Render one throwaway frame so the first real
        // request is correct.
        queue.unshift({ warmup: true, date: cfg.last(DATA), ow: 8, oh: 8 });
        p.loop();
      };
      // The paint MUST run inside draw so p5's pre/post hooks fire and the oil
      // engine binds/flushes each frame. The full buffer is read back with
      // gl.readPixels (alpha forced opaque), downscaled to the delivery size,
      // and posted as JPEG (fast, small). One job per frame; the loop parks
      // itself when the queue drains.
      p.draw = () => {
        const jb = queue.shift();
        if (!jb) { p.noLoop(); return; }
        const r = jb.warmup ? { target: jb.date, gap: 0 } : resolve.get(jb.date);
        const day = r && byDate.get(r.target);
        if (!day) { if (!jb.warmup) post({ type: 'render', reqId: jb.reqId, ok: false, date: jb.date, err: 'no-day' }); return; }
        const sil = silenceFor(r.gap);
        try {
          const pd = p.pixelDensity ? p.pixelDensity() : 1;
          if (jb.warmup) {
            // The oil engine's first paint after context creation comes out
            // cold. Render it, throw it away, and cache nothing.
            cfg.paint(p, day, DATA, p.width * pd, p.height * pd, sil);
            painted = null;
            return;
          }
          // Painted as it was written. Silence never reaches the painter — it is
          // applied below, to the finished image, so the form cannot move. And a
          // silence shows the SAME painting every day, only further faded: so
          // repaint only when the target day changes. Paging through a fortnight
          // of silence then costs one paint instead of fourteen.
          // A work whose painter consumes the silence must repaint when the
          // silence deepens, not only when the day changes — otherwise its rim
          // would keep shining on a body that has stopped reporting.
          const stamp = cfg.usesSilence ? r.target + '@' + r.gap : r.target;
          if (painted !== stamp) {
            const made = cfg.paint(p, day, DATA, p.width * pd, p.height * pd, sil);
            if (cfg.readback === '2d') {
              // The painter composed the sheet itself; take it as it is.
              if (!made) throw new Error('painter returned nothing');
              if (full.width !== made.width || full.height !== made.height) {
                full.width = made.width; full.height = made.height;
              }
              fctx.clearRect(0, 0, full.width, full.height);
              fctx.drawImage(made, 0, 0);
            } else {
              grabFull();
            }
            painted = stamp;
          }
          out.width = jb.ow; out.height = jb.oh;
          octx.clearRect(0, 0, jb.ow, jb.oh);
          octx.imageSmoothingQuality = 'high';
          // withering: colour drains, then presence dissolves into the ivory
          // ground until the canvas is blank (death), never toward black.
          octx.filter = r.gap > 0 && sil.gray > 0 ? `grayscale(${sil.gray.toFixed(3)})` : 'none';
          octx.drawImage(full, 0, 0, jb.ow, jb.oh);
          octx.filter = 'none';
          if (sil.fade > 0) {
            const gc = fctx.getImageData(1, 1, 1, 1).data;   // ground colour
            octx.fillStyle = `rgba(${gc[0]},${gc[1]},${gc[2]},${sil.fade.toFixed(3)})`;
            octx.fillRect(0, 0, jb.ow, jb.oh);
          }
          post({ type: 'render', reqId: jb.reqId, ok: true, date: jb.date, gap: r.gap, url: out.toDataURL('image/png') });
        } catch (e) {
          if (!jb.warmup) post({ type: 'render', reqId: jb.reqId, ok: false, date: jb.date, err: 'paint:' + String((e && e.stack) || e) });
        }
      };
    });
  }

  function announce() {
    const list = cfg.days(DATA);
    post({
      // `last` is the end of the CALENDAR (today, or the last written day when
      // the record is frozen) — the state the work is in now. `lastData` is the
      // last day the body actually wrote, for anything that needs the source.
      type: 'ready', work: WORK,
      birth: cfg.birth(DATA), last: calEnd, lastData: cfg.last(DATA), ratio: RATIO,
      count: list.length,
      alive: list.map((d) => d[cfg.dateField]),
      incomplete: list.filter((d) => d.i === 1).map((d) => d[cfg.dateField]),
    });
  }

  // Read the full framebuffer, flip GL's bottom-up rows, force alpha=255.
  function grabFull() {
    const gl = glCanvas.getContext('webgl2') || glCanvas.getContext('webgl');
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    if (full.width !== w || full.height !== h) { full.width = w; full.height = h; }
    const img = fctx.createImageData(w, h);
    const row = w * 4;
    for (let y = 0; y < h; y++) img.data.set(buf.subarray((h - 1 - y) * row, (h - y) * row), y * row);
    for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
    fctx.putImageData(img, 0, 0);
    return { w, h };
  }

  function post(obj) { parent.postMessage(Object.assign({ __art: true }, obj), '*'); }

  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.__artcmd !== true || m.type !== 'render') return;
    // Deliver at up to the full painted buffer (never upscale beyond it, never
    // downscale below what the display asks) so the image stays crisp.
    const capW = cfg.baseW * cfg.pd, capH = cfg.baseH * cfg.pd;
    const ow = Math.max(2, Math.min(capW, Math.round(m.w || 0)));
    const oh = Math.max(2, Math.min(capH, Math.round(m.h || 0)));
    queue.push({ reqId: m.reqId, date: m.date, ow, oh });
    if (ready && p5i) p5i.loop();       // wake the draw loop to consume the queue
  });

  boot().catch((e) => post({ type: 'error', work: WORK, error: String((e && e.stack) || e) }));
})();
</script>
</body>
</html>
