<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Nikolai Grigoriev</title>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main id="main">
  <div class="wrap">
    <div class="arch-head">
      <a class="back" id="back">← Back to the work</a>
      <h1 id="atitle">Archive</h1>
      <div class="sub" id="asub"></div>
      <div class="arch-legend">
        <span><i class="i-alive"></i>a day was written</span>
        <span><i class="i-dead"></i>silence — no data</span>
      </div>
    </div>
    <div class="arch-scroll" id="cal"></div>
  </div>
</main>
<div class="day-preview" id="preview"><img alt=""><div class="pv-date"></div></div>

<script src="/art/silence.js"></script>
<script src="/assets/site.js"></script>
<script>
  Site.mountHeader('works');
  const id = new URLSearchParams(location.search).get('id') || Site.WORKS[0].id;
  const work = Site.WORK_BY_ID[id];
  if (!work) location.href = '/works.html';
  document.getElementById('back').href = `/work.html?id=${id}`;
  document.getElementById('atitle').textContent = `${work.title} — Archive`;

  const cal = document.getElementById('cal');
  cal.setAttribute('role', 'region');
  cal.setAttribute('aria-label', 'Calendar of days — use the month headings to navigate; select a day to open it');
  const preview = document.getElementById('preview');
  const pvImg = preview.querySelector('img');
  const pvDate = preview.querySelector('.pv-date');

  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  // A silent day's shade follows the ONE shared death curve (art/silence.js) —
  // the same the painting uses: day with data = near-black, silence lightens,
  // death = near-white (blank canvas). One source, every surface identical.
  const silenceShade = (gap) => window.SILENCE.shade(gap);

  (async () => {
    const meta = await Site.ready(id);
    const { birth } = meta;
    const last = meta.last;                       // calendar runs to TODAY — the silent days are days of the work too
    const written = meta.alive.size;
    document.getElementById('asub').textContent =
      `${Site.fmtDate(birth)} — today · ${written.toLocaleString('en-US')} days written`;

    const b = Site.parseISO(birth), e = Site.parseISO(last);
    let y = b.y, m = b.m, lastAlive = birth;
    while (y < e.y || (y === e.y && m <= e.m)) {
      const monthEl = document.createElement('div');
      monthEl.className = 'arch-month';
      monthEl.innerHTML = `<h2>${Site.MONTHS_LONG[m - 1]} ${y}</h2>`;
      const row = document.createElement('div');
      row.className = 'arch-row';

      const dim = daysInMonth(y, m);
      for (let d = 1; d <= dim; d++) {
        const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        if (iso < birth || iso > last) continue;
        // Every day is a state of the work and opens it: a written day shows its
        // painting; a silent day holds the last painting as it withers.
        const cell = document.createElement('a');
        cell.className = 'cell';
        cell.dataset.date = iso;
        cell.href = `/work.html?id=${id}&date=${iso}`;
        if (meta.alive.has(iso)) {
          cell.classList.add('alive');
          if (meta.incomplete.has(iso)) cell.classList.add('incomplete');
          cell.title = Site.fmtDate(iso);
          lastAlive = iso;
        } else {
          const gap = Site.daysBetween(lastAlive, iso);
          cell.style.background = silenceShade(gap);   // withers by the work's real death curve
          cell.title = `${Site.fmtDate(iso)} — silence, day ${gap}`;
        }
        row.appendChild(cell);
      }
      monthEl.appendChild(row);
      cal.appendChild(monthEl);
      m++; if (m > 12) { m = 1; y++; }
    }

    // ── hover preview (desktop) ──────────────────────────────────────────
    const PVW = 150;
    const PVH = Math.round(PVW / meta.ratio);
    pvImg.style.width = PVW + 'px';
    pvImg.style.height = PVH + 'px';
    let hoverCell = null, showT = null;

    cal.addEventListener('mouseover', (ev) => {
      const cell = ev.target.closest('.cell');
      if (!cell || cell === hoverCell) return;
      hoverCell = cell;
      const date = cell.dataset.date;
      const alive = cell.classList.contains('alive');
      clearTimeout(showT);
      showT = setTimeout(async () => {              // debounce: don't render on a quick sweep
        if (hoverCell !== cell) return;
        position(cell);
        pvDate.textContent = Site.fmtDate(date) +
          (cell.classList.contains('incomplete') ? ' · partial' : (alive ? '' : ' · silence'));
        const url = await Site.render(id, date, PVW, PVH);
        if (url && hoverCell === cell) { pvImg.src = url; preview.classList.add('show'); }
      }, 180);
    });
    cal.addEventListener('mouseout', (ev) => {
      const to = ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('.cell');
      if (!to) { hoverCell = null; clearTimeout(showT); preview.classList.remove('show'); }
    });
    function position(cell) {
      const r = cell.getBoundingClientRect();
      const w = PVW + 12, h = PVH + 26;
      let x = r.right + 12, yy = r.top + r.height / 2 - h / 2;
      if (x + w > window.innerWidth - 8) x = r.left - w - 12;
      yy = Math.max(8, Math.min(window.innerHeight - h - 8, yy));
      preview.style.left = x + 'px';
      preview.style.top = yy + 'px';
    }
  })();
</script>
</body>
</html>
